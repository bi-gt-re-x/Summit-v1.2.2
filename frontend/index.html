<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two icons, and the order is not the preference — a browser takes the
         first format it understands. The SVG is the mark itself
         (utils/images/logo.svg, served by the backend at /static), so it is
         sharp at any size a tab, a bookmark bar or a pinned shortcut asks for;
         the .ico beside it is the same mountain rasterised at six sizes, for
         the browsers that will not take an SVG here. Both are the mark, so
         which one wins does not matter. -->
    <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS reads neither of the two icons above. It wants a PNG at a name it
         looks for whether or not the page mentions it, and it composites what
         it finds onto black, so the file has to be opaque. That file is the
         256px entry already inside favicon.ico, copied out by
         scripts/extract_touch_icon.py rather than drawn a second time. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Opened from the home screen, iOS gives it the whole screen instead of
         Safari's chrome; the status bar is then drawn over the page, so it is
         told to match rather than sit as a white band above the rail. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Summit" />
    <!-- The colour the browser paints its own surfaces, which is what stops an
         installed window opening with a strip of white above a dark page. Two,
         because the app has two themes and this is the one piece of chrome the
         stylesheet cannot reach. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Summit — a gamified productivity tracker: tasks, XP, streaks, a calendar, goals and growth analytics." />
    <title>Summit</title>

    <!-- The typefaces, actually fetched.
         Twelve stylesheets have asked for `'Inter'` since the app was written
         and nothing ever loaded it, so every one of them has been quietly
         rendering in Segoe UI or whatever the machine had. The four after it
         are the faces the notes toolbar offers: a note that says `{serif}` has
         to get a serif rather than the browser's idea of one.

         `preconnect` to both hosts because the stylesheet and the font files
         come from different origins, and the second connection is otherwise
         not opened until the CSS has parsed. `display=swap` so text paints in
         the fallback immediately rather than staying invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@600;700&family=Caveat:wght@500;700&display=swap"
    />
    <script>
      /* The whole look, before the first paint.
       *
       * The server-rendered pages get data-theme in the HTML they are sent, so
       * they never flash. A single-page app has no such luxury: index.html is
       * one static file. Reading the same `theme` cookie the backend sets, here
       * in the head, gets the same result — the attribute is right before any
       * CSS is applied and before React has loaded. src/context/ThemeContext
       * takes over from here.
       *
       * The accent and the palette are the same problem and did not have the
       * same answer. Both live in the account's preferences, which arrive over
       * the network after the auth check — so every load painted the built-in
       * violet on the built-in ground and then snapped to the reader's real
       * theme a few hundred milliseconds later. On Midnight or Sunset that is
       * the entire page changing colour after it has been read.
       *
       * They come from localStorage rather than a cookie because nothing on
       * the server renders them, so there is nobody to tell — see
       * src/utils/themeLook.ts, which writes this and explains the rest. The
       * key is spelled here and there; themeLook.test.ts reads this file and
       * fails if the two ever stop matching.
       *
       * Wrapped, because reading localStorage *throws* in Safari's private
       * mode rather than returning null, and a look that cannot be restored
       * has to be a flash rather than a blank page. */
      (function () {
        var root = document.documentElement;
        var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
        if (m) root.setAttribute('data-theme', m[1]);
        try {
          var look = JSON.parse(window.localStorage.getItem('summit:look') || '{}');
          /* Violet is the built-in and carries no attribute — the pages' own
             defaults are already violet, and setting it would override them
             with what they already say. Same rule as SettingsProvider. */
          if (look.accent && look.accent !== 'violet') root.setAttribute('data-accent', look.accent);
          if (look.skin) root.setAttribute('data-skin', look.skin);
        } catch (err) { /* no memory; the page loads plain and corrects itself */ }
      })();
    </script>
  </head>
  <!-- `has-rail` is what the stylesheets use to keep a page clear of the fixed
       navigation rail down the left; every page in this app has one, so it lives
       here rather than being toggled.

       Pinning the viewport is a separate class and NOT set here — it is true
       of the app pages and false of the landing page, so src/App.tsx sets it
       per route. See body.pins-viewport in src/styles/rail.css. -->
  <body class="has-rail">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
